name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get deploy info
        id: info
        run: |
          echo "by=$(git log -1 --format=%an)" >> "$GITHUB_OUTPUT"
          echo "at=$(git log -1 --format=%aI)" >> "$GITHUB_OUTPUT"
          echo "hash=$(git log -1 --format=%h)" >> "$GITHUB_OUTPUT"
          echo "msg=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Login Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEPLOY_BY=${{ steps.info.outputs.by }}
            DEPLOY_AT=${{ steps.info.outputs.at }}
            DEPLOY_HASH=${{ steps.info.outputs.hash }}
            DEPLOY_MSG=${{ steps.info.outputs.msg }}

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.SERVER_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

      # docker-compose.yml lives in zhizhu-server-deploy (/opt/zhizhu/sp-nextjs on the server)
      - name: Deploy
        env:
          # cloudflared reads the Access service token from TUNNEL_SERVICE_TOKEN_*
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash <<ENDSSH
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
            docker image prune -f
          ENDSSH
